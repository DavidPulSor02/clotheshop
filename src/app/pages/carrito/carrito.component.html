<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        .cart-item img {
            width: 80px;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center fw-bold">Carrito de Compras</h1>
        <div class="row mt-4">
            <div class="col-md-8">
                <div class="card shadow-sm p-3">
                    <h5 class="fw-bold">Tus productos</h5>
                    <div class="d-flex align-items-center border-bottom py-3 cart-item">
                        <img src="https://i.etsystatic.com/26975281/r/il/6ee130/2851704245/il_1140xN.2851704245_g2tp.jpg"
                            class="rounded me-3 img-thumbnail" alt="Producto">
                        <div class="flex-grow-1">
                            <h6 class="fw-bold">Producto 1</h6>
                            <p class="text-muted">Talla: M | Color: Negro</p>
                        </div>
                        <span class="fw-bold me-3">$250.00</span>
                        <button class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
                    </div>
                    <div class="d-flex align-items-center border-bottom py-3 cart-item">
                        <img src="https://th.bing.com/th/id/OIP.P_2pw6oivyN_ktQTCxe1DgHaHa?rs=1&pid=ImgDetMain"
                            class="rounded me-3 img-thumbnail" alt="Producto">
                        <div class="flex-grow-1">
                            <h6 class="fw-bold">Producto 2</h6>
                            <p class="text-muted">Talla: L | Color: Azul</p>
                        </div>
                        <span class="fw-bold me-3">$450.00</span>
                        <button class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <h5 class="fw-bold">Resumen</h5>
                    <div class="d-flex justify-content-between">
                        <span>Subtotal</span>
                        <span class="fw-bold">$700.00</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>Envío</span>
                        <span class="fw-bold">$50.00</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <span class="fw-bold">Total</span>
                        <span class="fw-bold">$750.00</span>
                    </div>
                    <button class="btn btn-primary w-100 mt-3">Proceder al pago</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
